name: Weekly Image Scan

on:
  schedule:
    - cron: '0 9 * * 0'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy - image scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        env:
          TRIVY_SKIP_VERSION_CHECK: "true"
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}:latest
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln
          # Soft mode: omit exit-code. Hard mode: add exit-code: '1'.
          format: sarif
          output: trivy-weekly.sarif

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@bce182f857edf1feab116e9795a3393d21977282  # v4
        with:
          sarif_file: trivy-weekly.sarif
          category: trivy-weekly

      - name: Grype - image scan
        id: grype
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2  # v7.4.0
        with:
          image: ghcr.io/${{ github.repository }}:latest
          fail-build: false
          severity-cutoff: high
          output-format: sarif
          only-fixed: true

      - name: Upload Grype SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@bce182f857edf1feab116e9795a3393d21977282  # v4
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype-weekly
